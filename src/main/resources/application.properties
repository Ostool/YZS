# ========== 企微机器人 Webhook（生产环境通过环境变量覆盖）==========
wechat.webhook.url=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECHAT_WEBHOOK_KEY:ce598a71-d229-4c65-ac20-7a4e5f09056d}

# ========== 日志配置 ==========
logging.level.com.yezishuo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# ========== 数据库配置（生产环境通过环境变量覆盖）==========
spring.datasource.url=jdbc:mysql://localhost:3306/usermanager?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA 配置（生产环境改为 validate）==========
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ========== Session 配置 ==========
server.servlet.session.timeout=30m
spring.session.store-type=none

# ========== 服务器配置 ==========
server.port=8080

# ========== Jackson 时区 ==========
spring.jackson.time-zone=Asia/Shanghai
