<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>叶子说眼镜 · 内部公告平台</title>
    <style>

        /* 文章详情弹窗样式 */
        .article-modal {
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .article-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--klein-blue);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--klein-blue);
        }
        .article-meta {
            color: #999;
            font-size: 12px;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .article-content {
            line-height: 1.8;
            font-size: 14px;
            color: #333;
        }
        .article-content h1 { font-size: 22px; margin: 20px 0 10px; color: #222; }
        .article-content h2 { font-size: 20px; margin: 18px 0 10px; color: #333; }
        .article-content h3 { font-size: 18px; margin: 15px 0 8px; color: #444; }
        .article-content p { margin: 10px 0; }
        .article-content ul, .article-content ol { margin: 10px 0 10px 30px; }
        .article-content li { margin: 5px 0; }
        .article-content blockquote {
            margin: 15px 0;
            padding: 10px 20px;
            background: #f5f5f5;
            border-left: 4px solid var(--klein-blue);
        }
        .article-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }
        .article-content th, .article-content td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .article-content th { background: #f2f2f2; }

        /* 富文本编辑器工具栏样式 */
        .editor-toolbar {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .editor-toolbar button {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .editor-toolbar button:hover {
            background: var(--klein-blue);
            color: white;
            border-color: var(--klein-blue);
        }
        .editor-toolbar select {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }
        .editor-content {
            border: 1px solid #ddd;
            border-radius: 0 0 8px 8px;
            padding: 15px;
            min-height: 300px;
            overflow-y: auto;
            background: white;
        }
        .editor-content:focus {
            outline: none;
            border-color: var(--klein-blue);
        }

        .date-badge {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            font-weight: 500;
            background: linear-gradient(135deg, #002FA7 0%, #667eea 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .delete-image-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #f56565;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            text-align: center;
            line-height: 18px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 15;
        }
        .delete-image-btn:hover {
            background: #e53e3e;
            transform: scale(1.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
            color: #1e293b;
            line-height: 1.4;
            padding: 20px 16px 48px;
        }
        :root {
            --klein-blue: #002FA7;
            --klein-light: #eef3ff;
            --klein-hover: #0024a0;
            --gray-border: #e9edf2;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .app-container { max-width: 1280px; margin: 0 auto; }

        /* 头部可点击 */
        .brand-name { cursor: pointer; }
        .brand-name:hover { opacity: 0.8; }

        .brand-header {
            background: white;
            border-radius: 32px;
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--gray-border);
        }
        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            justify-content: space-between;
        }
        .brand-name { font-size: 28px; font-weight: 800; color: var(--klein-blue); letter-spacing: -0.3px; }
        .brand-slogan { background: var(--klein-light); padding: 4px 14px; border-radius: 40px; font-size: 13px; color: var(--klein-blue); font-weight: 500; }
        .admin-controls { display: flex; gap: 12px; align-items: center; }
        .btn-admin {
            background: var(--klein-blue);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-admin:hover { background: var(--klein-hover); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--klein-blue); color: var(--klein-blue); }
        .btn-outline:hover { background: var(--klein-light); }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .company-desc {
            background: #f8fafc;
            border-radius: 24px;
            padding: 16px 20px;
            margin-top: 12px;
            border-left: 4px solid var(--klein-blue);
            font-size: 14px;
            color: #2c3e66;
        }
        .vision-box { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 8px; row-gap: 10px; align-items: center; }
        .vision-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .vision-tag { background: var(--klein-light); padding: 2px 12px; border-radius: 30px; color: var(--klein-blue); font-weight: 500; }
        .date-badge { font-size: 14px; color: #5b6e8c; background: #f1f4f9; padding: 6px 14px; border-radius: 40px; display: inline-block; }

        .reward-section {
            background: linear-gradient(135deg, var(--klein-blue) 0%, #0039c7 100%);
            border-radius: 32px;
            padding: 20px 24px;
            margin-bottom: 24px;
            color: white;
            box-shadow: 0 12px 24px rgba(0, 47, 167, 0.18);
            position: relative;
        }
        .reward-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 12px; }
        .reward-header h3 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .reward-badge { background: rgba(255,255,240,0.2); padding: 4px 12px; border-radius: 40px; font-size: 13px; }
        .reward-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 12px; }
        .reward-card-item { background: rgba(255,255,255,0.08); backdrop-filter: blur(2px); border-radius: 24px; padding: 14px 18px; border: 1px solid rgba(255,255,255,0.2); position: relative; }
        .reward-card-item strong { font-size: 16px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .reward-detail { font-size: 13.5px; line-height: 1.45; opacity: 0.92; }
        .reward-remark { margin-top: 16px; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 12px 16px; font-size: 12.5px; }
        .reward-footer { margin-top: 12px; font-size: 13px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; }

        .edit-icon, .delete-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .reward-card-item:hover .edit-icon, .reward-card-item:hover .delete-icon,
        .section-card:hover .edit-icon, .list-item:hover .edit-icons,
        .list-item:hover .edit-icon { opacity: 1; }
        .delete-icon { right: 60px; background: rgba(220, 50, 50, 0.7); }
        /* 管理员模式下，团建基金的编辑删除按钮始终可见，不需要悬停 */
        .admin-mode .list-item .edit-icon,
        .admin-mode .list-item .delete-icon {
            opacity: 1 !important;
            position: static;
            display: inline-block;
            margin-left: 5px;
        }

        /* 管理员模式下，巡检记录的编辑删除按钮始终可见 */
        .admin-mode .inspect-table td .edit-icon,
        .admin-mode .inspect-table td .delete-icon {
            opacity: 1 !important;
            position: static;
            display: inline-block;
            margin-left: 5px;
        }
        .header-edit-icon { margin-left: 12px; background: rgba(0,0,0,0.1); border-radius: 20px; padding: 2px 8px; font-size: 11px; cursor: pointer; display: inline-block; }

        .section-card { background: white; border-radius: 28px; margin-bottom: 28px; box-shadow: var(--card-shadow); border: 1px solid var(--gray-border); overflow: hidden; position: relative; }
        .card-header { padding: 20px 24px 12px 24px; border-bottom: 1px solid #eff3f8; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .card-title { font-size: 20px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .badge-icon { background: var(--klein-light); border-radius: 40px; padding: 4px 14px; font-size: 12px; color: var(--klein-blue); font-weight: 500; }
        .edit-title-btn { background: transparent; border: 1px dashed #ccc; border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer; margin-left: 8px; }
        .edit-title-btn:hover { background: var(--klein-light); }
        .list-item { padding: 14px 24px; border-bottom: 1px solid #f0f2f6; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; position: relative; align-items: center; }
        .amount { color: var(--klein-blue); font-weight: 700; }
        .inspire-note { background: #fefce8; margin: 12px 24px 20px; padding: 12px 16px; border-radius: 20px; font-size: 13px; position: relative; }
        .admin-actions { display: none; align-items: center; gap: 8px; }

        .inspect-table-wrapper { overflow-x: auto; padding: 0 20px 20px 20px; }
        .inspect-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 800px; }
        .inspect-table th { text-align: left; padding: 12px 12px; background: #f8fafd; color: #1e2f4e; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        .inspect-table td { padding: 14px 12px; border-bottom: 1px solid #f0f2f6; vertical-align: middle; }
        .image-preview { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .image-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; transition: transform 0.2s; }
        .image-thumb:hover { transform: scale(1.05); border-color: var(--klein-blue); }
        .no-image { color: #999; font-size: 12px; font-style: italic; }
        .camera-icon { font-size: 24px; cursor: pointer; padding: 8px; background: var(--klein-light); border-radius: 50%; display: inline-block; transition: all 0.2s; }
        .camera-icon:hover { background: var(--klein-blue); color: white; transform: scale(1.05); }
        .review-done { color: #2e7d32; background: #e8f5e9; border-radius: 20px; padding: 2px 10px; display: inline-block; }
        .filter-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .period-select { border: 1px solid #cfdfed; border-radius: 30px; padding: 6px 16px; background: white; font-size: 14px; }

        .image-preview-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .image-preview-modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        .image-preview-close { position: absolute; top: 20px; right: 40px; color: white; font-size: 40px; cursor: pointer; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 28px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 24px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
        .modal-header h3 { font-size: 20px; }
        .modal-close { font-size: 28px; cursor: pointer; color: #999; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 14px; }
        .btn-submit { background: var(--klein-blue); color: white; border: none; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 14px; }
        .btn-cancel { background: #ccc; color: #333; border: none; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 14px; margin-right: 10px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; font-size: 14px; z-index: 3000; display: none; }

        @media (max-width: 720px) {
            .reward-grid { grid-template-columns: 1fr; }
            .card-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .logo-area { flex-direction: column; }
            .admin-controls { width: 100%; justify-content: space-between; }
        }

        /* 团建基金列表 - 限制高度并添加滚动条 */
        .fund-list-container {
            max-height: 300px;
            overflow-y: auto;
            border-top: 1px solid #f0f2f6;
        }

        /* 巡检表格容器 - 限制高度并添加滚动条 */
        .inspect-table-container {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
        }

        /* 实时时间样式 */
        .real-time-clock {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            font-weight: 500;
            background: linear-gradient(135deg, #002FA7 0%, #667eea 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }

        .time-seconds {
            font-size: 12px;
            opacity: 0.9;
        }

        /* 滚动条美化 */
        .fund-list-container::-webkit-scrollbar,
        .inspect-table-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .fund-list-container::-webkit-scrollbar-track,
        .inspect-table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .fund-list-container::-webkit-scrollbar-thumb,
        .inspect-table-container::-webkit-scrollbar-thumb {
            background: var(--klein-blue);
            border-radius: 10px;
        }

        .fund-list-container::-webkit-scrollbar-thumb:hover,
        .inspect-table-container::-webkit-scrollbar-thumb:hover {
            background: var(--klein-hover);
        }
        /* 确保管理员模式下的编辑删除按钮可见 */
        .inspect-table td .edit-icon,
        .inspect-table td .delete-icon {
            position: static;
            display: inline-block;
            margin-left: 5px;
            opacity: 1;
        }

        .admin-actions .edit-icon,
        .admin-actions .delete-icon {
            position: static;
            display: inline-block;
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="brand-header">
        <div class="logo-area">
            <div>
                <div class="brand-name" onclick="goToHome()">🍃 叶子说眼镜</div>
                <div class="brand-slogan">内部公告 · 实时同步</div>
            </div>
            <div class="admin-controls">
                <span class="date-badge" id="liveDate"></span>
                <button class="btn-admin btn-outline" id="toggleModeBtn" onclick="toggleMode()">👑 切换管理员模式</button>
                <button class="btn-admin" id="loginBtn" style="display:none;" onclick="showLoginModal()">登录</button>
            </div>
        </div>
        <div class="company-desc" id="companyDesc"></div>
    </div>

    <!-- 1. 规章制度 -->
    <div class="section-card">
        <div class="card-header">
            <div class="card-title">📖 公司规则制度 <span class="badge-icon" id="rulesVersion"></span></div>
            <div class="admin-actions">
                <button class="edit-title-btn" onclick="editRulesVersion()">✏️ 编辑版本</button>
                <button class="edit-title-btn" onclick="addRule()">➕ 新增</button>
            </div>
        </div>
        <div id="rulesList"></div>
        <div class="inspire-note" id="rulesNote">
            <span id="rulesNoteText"></span>
            <span class="admin-actions"><button class="edit-title-btn" onclick="editRulesNote()" style="margin-left:12px;">✏️ 编辑提示</button></span>
        </div>
    </div>

    <!-- 2. 销售奖励 -->
    <div class="reward-section">
        <div class="reward-header">
            <h3>🔥 <span id="rewardTitle"></span> <span class="reward-badge" id="rewardPeriod"></span></h3>
            <div class="admin-actions">
                <button class="edit-title-btn" onclick="editRewardTitle()">✏️ 编辑标题</button>
                <button class="edit-title-btn" onclick="editRewardPeriod()">✏️ 编辑周期</button>
            </div>
        </div>
        <div id="rewardGrid"></div>
        <div class="reward-remark" id="rewardRemark"></div>
        <div class="reward-footer">
            <span id="rewardFooterLeft"></span>
            <span id="rewardFooterRight"></span>
        </div>
        <div class="admin-actions" style="text-align:center; margin-top:12px; justify-content:center;">
            <button class="edit-title-btn" onclick="editRewardFooterLeft()">✏️ 编辑主推提醒</button>
            <button class="edit-title-btn" onclick="editRewardFooterRight()">✏️ 编辑周期显示</button>
            <button class="edit-title-btn" onclick="addReward()">➕ 添加奖励板块</button>
            <button class="edit-title-btn" onclick="editRewardRemark()">✏️ 编辑特别说明</button>
        </div>
    </div>

    <!-- 3. 团建基金 -->
    <div class="section-card">
        <div class="card-header">
            <div class="card-title">🤝 团建基金筹集明细 <span class="badge-icon">快乐建设资金</span></div>
            <div class="admin-actions">
                <button class="edit-title-btn" onclick="addFundItem()">➕ 新增明细</button>
                <button class="edit-title-btn" onclick="editFundNote()">✏️ 编辑备注</button>
            </div>
        </div>
        <div class="fund-list-container">
            <div id="fundList"></div>
        </div>
        <div class="inspire-note" id="fundNote" onclick="editFundNote()"></div>
    </div>

    <!-- 4. 巡检结果 -->
    <!-- 4. 巡检结果 -->
    <div class="section-card">
        <div class="card-header">
            <div class="card-title">🧹 门店卫生检查结果告示 <span class="badge-icon">巡检结果</span></div>
            <div class="filter-bar">
                <label>📅 巡检批次：</label>
                <select id="inspectPeriod" class="period-select"></select>
                <div class="admin-actions">
                    <button class="edit-title-btn" onclick="addInspectPeriod()">➕ 新增批次</button>
                    <button class="edit-title-btn" onclick="addInspectRecord()">➕ 新增记录</button>
                </div>
            </div>
        </div>
        <div class="inspect-table-container">
            <div class="inspect-table-wrapper">
                <table class="inspect-table">
                    <thead>
                    <tr><th>门店</th><th>检查图片</th><th>整改期限</th><th>复查时间</th><th>复查结果</th><th class="admin-actions">操作</th></tr>
                    </thead>
                    <tbody id="inspectTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="inspire-note" id="inspectNote" onclick="editInspectNote()"></div>
    </div>
    <div class="footer-note" style="text-align:center; margin-top:24px; font-size:12px; color:#7c8aa0;">🍃 叶子说眼镜 · 所有公告最终解释权归叶子说眼镜总部</div>
</div>

<!-- 登录模态框（带记住密码） -->
<div id="loginModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header"><h3>管理员登录</h3><span class="modal-close" onclick="closeLoginModal()">&times;</span></div>
        <div class="modal-body">
            <div class="form-group"><label>用户名</label><input type="text" id="loginUsername" placeholder="请输入用户名"></div>
            <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码"></div>
            <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
                <input type="checkbox" id="rememberPwd" style="width: auto;">
                <label style="margin-bottom: 0;">记住密码</label>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn-cancel" onclick="closeLoginModal()">取消</button>
                <button class="btn-submit" onclick="doLogin()">登录</button>
            </div>
        </div>
    </div>
</div>

<!-- 通用编辑模态框 -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3 id="modalTitle">编辑内容</h3><span class="modal-close" onclick="closeEditModal()">&times;</span></div>
        <div id="modalBody"></div>

            if (m === '>') return '&gt;';
            return m;

    function updateRealTimeClock() {

    function compressImage(file, maxSizeKB = 300) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let quality = 0.8, maxWidth = 1200, width = img.width, height = img.height;
                    if (width > maxWidth) { height = height * (maxWidth / width); width = maxWidth; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    let result = canvas.toDataURL('image/jpeg', quality);
                    let fileSizeKB = Math.round((result.length * 3/4) / 1024);
                    while (fileSizeKB > maxSizeKB && quality > 0.3) {
                        quality -= 0.1;
                        result = canvas.toDataURL('image/jpeg', quality);
                        fileSizeKB = Math.round((result.length * 3/4) / 1024);
                    }
                    resolve(result);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

                ...options,
                body: options.body ? JSON.stringify(options.body) : undefined
            });
            return await response.json();
        } catch (error) {
            console.error('API请求失败:', error);
            return { success: false, message: '网络错误' };

    }

    async function doLogin() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const rememberPwdCheckbox = document.getElementById('rememberPwd');
        const rememberPwd = rememberPwdCheckbox ? rememberPwdCheckbox.checked : false;
        const result = await apiFetch('/auth/login', { method: 'POST', body: { username, password } });

        if (result.success) {
            // 保存登录信息
            if (rememberPwd) {
                localStorage.setItem('announcement_username', username);
                localStorage.setItem('announcement_password', password);
                localStorage.setItem('announcement_remember', 'true');
            } else {
                localStorage.removeItem('announcement_username');
                localStorage.removeItem('announcement_password');
                localStorage.setItem('announcement_remember', 'false');
            }

            // 获取角色等级
            if (result.user && result.user.roleLevel !== undefined) {
                currentUserRoleLevel = result.user.roleLevel;
            } else {
                currentUserRoleLevel = 2;
            }
            isAdmin = (currentUserRoleLevel === 0 || currentUserRoleLevel === 1);

    function openEditModal(title, fields, callback) {

        const modalBody = document.getElementById('modalBody');
        modalTitle.textContent = title;
        let html = '';
        for (const field of fields) {
            html += `<div class="form-group"><label>${field.label}</label>`;
            if (field.type === 'textarea') {
                html += `<textarea id="edit_${field.name}">${field.value || ''}</textarea>`;
            } else if (field.type === 'date') {
                html += `<input type="date" id="edit_${field.name}" value="${field.value || ''}">`;
            } else {
                let fieldValue = field.value !== undefined && field.value !== null ? String(field.value) : '';
                html += `<input type="${field.type || 'text'}" id="edit_${field.name}" value="${fieldValue.replace(/"/g, '&quot;')}">`;
            }
            html += `</div>`;
        }
        modalBody.innerHTML = html;
        currentEditCallback = callback;
        modal.style.display = 'flex';
    }

    async function loadInspections() {
        const result = await apiFetch('/inspections');
        if (result) {
            inspectPeriods = result.periods || [];
            currentInspectPeriod = result.currentPeriod || '';
            inspections = result.inspections || [];
            inspectNote = result.inspectNote || '';

            // 更新下拉框
            const select = document.getElementById('inspectPeriod');
            if (select) {
                select.innerHTML = inspectPeriods.map(p => `<option value="${p}" ${p === currentInspectPeriod ? 'selected' : ''}>${p} 巡检结果</option>`).join('');
                select.onchange = async () => {
                    currentInspectPeriod = select.value;
                    const res = await apiFetch(`/inspections/period/${currentInspectPeriod}`);
                    if (res.success) {
                        inspections = res.data || [];
                        renderInspections();
                    }
                };
            }
            renderInspections();

    function renderInspections() {

            // 判断图片是Base64还是路径

            let imageSrc = item.imageData || '';

            return `
            <tr data-id="${item.id}" onclick="viewOrEditInspectRecord(${item.id})">
                <td><strong>${item.storeName}</strong></td>
                <td>
                    <div class="image-preview" onclick="event.stopPropagation()">
                        ${item.imageData ?
                `<div style="position: relative; display: inline-block;">
                                <img src="${imageSrc}" class="image-thumb" onclick="showImagePreview('${imageSrc}')">
                                ${isAdmin ? `<span class="delete-image-btn" onclick="deleteInspectionImage(${item.id})" title="删除图片">×</span>` : ''}
                            </div>` :
                '<span class="no-image">暂无图片</span>'
            }
                        ${isAdmin ? `<span class="camera-icon" onclick="openImageUpload(${item.id})">📷</span>` : ''}
                    </div>
                </td>
                <td>${item.deadline || '-'}</td>
                <td>${item.reviewDate || '-'}</td>
                <td><span class="${item.result === '已整改' || item.result === '优秀门店' ? 'review-done' : ''}">${item.result || '-'}</span></td>
                ${isAdmin ? `<td><span class="edit-icon" onclick="event.stopPropagation(); editInspectRecord(${item.id})">✏️</span><span class="delete-icon" onclick="event.stopPropagation(); deleteInspectRecord(${item.id})">🗑️</span></td>` : ''}
            <tr>
        `;
        }).join('');
    }

    function addInspectPeriod() {
        openEditModal('新增巡检批次', [{ name: 'period', label: '批次日期（格式：20260512）', value: '' }], async () => {
            const period = document.getElementById('edit_period').value;

            // 格式验证
            if (!/^\d{8}$/.test(period)) {
                showToast('批次格式错误，请输入8位数字（如：20260512）');
                return;
            }

            // 检查是否已存在
            if (inspectPeriods.includes(period)) {
                showToast('批次已存在');
                return;
            }

            // 添加到数组并排序（最新的在前面）
            inspectPeriods.unshift(period);
            inspectPeriods.sort((a, b) => b.localeCompare(a));

            // 设置为当前选中的批次
            currentInspectPeriod = period;

            // 如果该批次还没有数据，初始化空数组
            if (!inspectionsByPeriod[period]) {
                inspectionsByPeriod[period] = [];
            }
            inspections = [];

            // 更新下拉框
            const select = document.getElementById('inspectPeriod');
            if (select) {
                select.innerHTML = inspectPeriods.map(p => `<option value="${p}" ${p === period ? 'selected' : ''}>${p} 巡检结果</option>`).join('');
            }

            // 重新渲染表格
            renderInspections();
            showToast('批次添加成功');
        });
    }

    // 图片上传
    function openImageUpload(id) {
        currentUploadInspectionId = id;
        document.getElementById('uploadFileInput').value = '';
        document.getElementById('uploadPreviewContainer').innerHTML = '';
        tempImageBase64 = null;
        document.getElementById('imageUploadModal').style.display = 'flex';

        const fileInput = document.getElementById('uploadFileInput');
        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (file && file.type.match('image.*')) {
                showToast('正在压缩图片...');
                const compressed = await compressImage(file, 300);
                tempImageBase64 = compressed;
                document.getElementById('uploadPreviewContainer').innerHTML = `<img src="${compressed}" style="max-width:200px; border-radius:8px;">`;
            } else {
                showToast('请选择图片文件');
            }
        };
    }

    function closeImageUploadModal() { document.getElementById('imageUploadModal').style.display = 'none'; currentUploadInspectionId = null; tempImageBase64 = null; }
    async function confirmUploadImage() {
        if (currentUploadInspectionId && tempImageBase64) {
            const result = await apiFetch(`/inspections/${currentUploadInspectionId}/inspection-image`, { method: 'PUT', body: { imageData: tempImageBase64 } });
            if (result.success) { showToast('图片上传成功'); loadInspections(); }
            else showToast(result.message || '上传失败');
        } else showToast('请先选择图片');
        closeImageUploadModal();
    }

<div id="editorModal" class="modal">
    <div class="modal-content" style="max-width: 900px;">
        <div class="modal-header">
            <h3 id="editorModalTitle">编辑文章</h3>
            <span class="modal-close" onclick="closeEditorModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>文章标题</label>
                <input type="text" id="editorTitle" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>标签/分类</label>
                <input type="text" id="editorTag" placeholder="如：考勤、仪容仪表" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>版本号</label>
                <input type="text" id="editorVersion" placeholder="生效日期或版本号" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>正文内容</label>
                <div class="editor-toolbar">
                    <select id="formatBlock" onchange="formatDocument('formatBlock', this.value); this.value='';">
                        <option value="">段落格式</option>
                        <option value="h1">标题1</option>
                        <option value="h2">标题2</option>
                        <option value="h3">标题3</option>
                        <option value="p">正文</option>
                    </select>
                    <button type="button" onclick="formatDocument('bold')"><b>B</b></button>
                    <button type="button" onclick="formatDocument('italic')"><i>I</i></button>
                    <button type="button" onclick="formatDocument('underline')"><u>U</u></button>
                    <button type="button" onclick="formatDocument('insertOrderedList')">1.</button>
                    <button type="button" onclick="formatDocument('insertUnorderedList')">•</button>
                    <button type="button" onclick="formatDocument('indent')">→ 缩进</button>
                    <button type="button" onclick="formatDocument('outdent')">← 取消缩进</button>
                    <button type="button" onclick="formatDocument('justifyLeft')">左对齐</button>
                    <button type="button" onclick="formatDocument('justifyCenter')">居中</button>
                    <button type="button" onclick="formatDocument('justifyRight')">右对齐</button>
                    <button type="button" onclick="clearFormatting()">清除格式</button>
                </div>
                <div id="editorContent" class="editor-content" contenteditable="true"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeEditorModal()">取消</button>
            <button class="btn btn-primary" onclick="saveArticle()">保存</button>
        </div>
    </div>
</div>
