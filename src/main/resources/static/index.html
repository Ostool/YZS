<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叶子说眼镜 · 内部系统门户</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #002FA7 0%, #0050e6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .portal-container {
            max-width: 1200px;
            width: 100%;
        }

        .brand {
            text-align: center;
            margin-bottom: 50px;
        }

        .brand h1 {
            font-size: 48px;
            color: white;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .brand p {
            font-size: 18px;
            color: rgba(255,255,255,0.8);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .portal-card {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-decoration: none;
            display: block;
        }

        .portal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .card-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .portal-card h2 {
            font-size: 24px;
            color: #002FA7;
            margin-bottom: 15px;
        }

        .portal-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .card-footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 600px) {
            .brand h1 { font-size: 32px; }
            .portal-card { padding: 25px 20px; }
            .card-icon { font-size: 48px; }
        }
    </style>
</head>
<body>
<div class="portal-container">
    <div class="brand">
        <h1>🍃 叶子说眼镜</h1>
        <p>内部管理系统 · 统一门户</p>
    </div>
    <div class="card-grid">
        <a href="prescription.html" class="portal-card">
            <div class="card-icon">👓</div>
            <h2>配镜处方管理系统</h2>
            <p>会员验光记录、处方管理、销售统计等核心业务功能</p>
            <div class="card-footer">🔐 需要登录验证</div>
        </a>
        <a href="announcement.html" class="portal-card">
            <div class="card-icon">📢</div>
            <h2>内部公告平台</h2>
            <p>公司制度、销售激励、巡检结果、团建基金等公告信息</p>
            <div class="card-footer">👁️ 游客可查看 · 登录后可编辑</div>
        </a>
        <a href="#" class="portal-card" style="pointer-events:none;opacity:0.5;cursor:not-allowed;" onclick="return false;">
            <div class="card-icon">📦</div>
            <h2>货盘调货系统 <span style="font-size:12px;color:#e53e3e;">(暂未开放)</span></h2>
            <p>门店货盘管理、库存盘点、门店间调货协同、月末统计对账</p>
            <div class="card-footer">⏳ 功能开发中，敬请期待</div>
        </a>
    </div>
</div>
</body>
</html>
